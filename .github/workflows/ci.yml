name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck every Edge Function
        run: for f in supabase/functions/*/index.ts; do deno check --node-modules-dir=auto "$f"; done
      - name: Edge Function tests (hosted-project tests skip themselves when the secrets are absent)
        run: deno test --allow-env --allow-net --allow-read supabase/functions/tests/
