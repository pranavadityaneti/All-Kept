<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>All Kept Food category prototype</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: Garet, "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    body {
      width: 540px; height: 680px; margin: 0; display: grid; place-items: center;
      color: #17131d; background: #f2f4f8;
    }
    .board { display: grid; justify-items: center; gap: 22px; }
    .tile {
      position: relative; width: 300px; aspect-ratio: .8; overflow: hidden;
      border-radius: 48px; background: #ede8ff;
      box-shadow: 0 22px 48px rgba(70, 52, 106, .13);
    }
    .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .copy { position: absolute; top: 32px; left: 32px; right: 24px; display: grid; gap: 5px; }
    h1 { margin: 0; color: #241f44; font-size: 40px; line-height: 1.06; font-weight: 700; letter-spacing: -.035em; }
    p { margin: 0; color: rgba(65, 35, 61, .58); font-size: 29px; line-height: 1.15; font-weight: 500; }
    .caption { color: #686474; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <main class="board">
    <div class="tile">
      <img src="../../../../apps/mobile/assets/categories/food-minimal-dark-purple-v5.png" alt="" />
      <div class="copy"><h1>Food</h1><p>19 Saves!</p></div>
    </div>
    <div class="caption">Food category prototype</div>
  </main>
</body>
</html>
